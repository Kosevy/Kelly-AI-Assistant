<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly — Asistente Local</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e88e5">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: 1.5rem 1rem;
            gap: 1.25rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        /* Botón push-to-talk */
        #recordBtn {
            width: 8.5rem;
            height: 8.5rem;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            background: #1e3a5f;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        #recordBtn:active,
        #recordBtn.recording {
            background: #7f1d1d;
            border-color: #ef4444;
            transform: scale(0.96);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        #recordBtn.playing {
            border-color: #22c55e;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
        }

        .mic-icon { font-size: 2rem; line-height: 1; }

        /* Status */
        #status {
            font-size: 0.9rem;
            color: #64748b;
            min-height: 1.4em;
            transition: color 0.2s;
            text-align: center;
        }
        #status.active { color: #94a3b8; }
        #status.error  { color: #f87171; }

        #conn-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: #64748b;
            display: inline-block;
            margin-right: 0.35rem;
            transition: background 0.3s;
        }
        #conn-dot.connected    { background: #22c55e; }
        #conn-dot.disconnected { background: #ef4444; }

        /* ── Panel de historial ─────────────────────────────────────────── */
        #history-panel {
            width: min(95vw, 32rem);
            background: #1e293b;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 55vh;
            border: 1px solid #334155;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.9rem;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        .history-header span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #clearBtn {
            background: none;
            border: 1px solid #334155;
            color: #64748b;
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.35rem;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        #clearBtn:hover { color: #f87171; border-color: #f87171; }

        #history-messages {
            overflow-y: auto;
            padding: 0.75rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 3rem;
        }

        .msg {
            font-size: 0.83rem;
            line-height: 1.45;
            max-width: 100%;
            word-break: break-word;
        }

        .msg-user {
            color: #60a5fa;
        }
        .msg-user::before { content: "Tú  "; font-weight: 700; }

        .msg-assistant {
            color: #86efac;
        }
        .msg-assistant::before { content: "Kelly  "; font-weight: 700; }

        .msg-system {
            color: #475569;
            font-style: italic;
            font-size: 0.75rem;
        }

        .empty-hint {
            color: #334155;
            font-size: 0.8rem;
            font-style: italic;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <h1>✦ Kelly</h1>

    <button id="recordBtn" aria-label="Mantén presionado para hablar">
        <span class="mic-icon">🎙️</span>
        <span id="btnLabel">Hablar</span>
    </button>

    <p id="status">
        <span id="conn-dot"></span>
        <span id="statusText">Conectando...</span>
    </p>

    <!-- Panel de historial (B4) -->
    <div id="history-panel" role="log" aria-live="polite" aria-label="Historial de conversación">
        <div class="history-header">
            <span>Conversación</span>
            <button id="clearBtn" title="Borrar historial">Borrar</button>
        </div>
        <div id="history-messages">
            <p class="empty-hint">Mantén presionado el botón y habla con Kelly</p>
        </div>
    </div>

<script>
// ─── Referencias DOM ──────────────────────────────────────────────────────────
const btn          = document.getElementById('recordBtn');
const btnLabel     = document.getElementById('btnLabel');
const statusText   = document.getElementById('statusText');
const statusEl     = document.getElementById('status');
const connDot      = document.getElementById('conn-dot');
const historyMsgs  = document.getElementById('history-messages');
const clearBtn     = document.getElementById('clearBtn');

// ─── Estado ───────────────────────────────────────────────────────────────────
let mediaRecorder  = null;
let audioChunks    = [];
let isPlaying      = false;
let ws             = null;

// ─── PCM streaming state ──────────────────────────────────────────────────────
let audioCtx      = null;    // AudioContext (lazy init — satisfies autoplay policy)
let nextPlayTime  = 0;       // Scheduling clock for gapless playback
let audioFormat   = { sampleRate: 24000, channels: 1, dtype: 'int16' };

// Ordered playback state
let nextSentenceId   = 0;           // Next sentence_id we expect to play
let pendingSentences = {};           // sentence_id -> { chunks: ArrayBuffer[], done: bool }

// ─── E2E timing state (diagnosing the gap between components and e2e) ─────────
// These mirror the backend [timing] log, covering the frontend half of the round-trip.
// Read: Open DevTools → Console, filter by "[FE timing]" to see the breakdown.
//
//   t_send      : audio blob sent over WebSocket (end of PTT recording)
//   t_transcript: transcript JSON received (STT done on server)
//   t_first_byte: first PCM binary chunk received from WS
//   t_play_start: AudioContext.currentTime when first buffer starts playing
//
// The gap between t_send and t_first_byte is roughly equal to the backend's
// e2e_BE(sum) from the [timing] log. Any remaining gap vs e2e_first_audio_ms
// lives in the frontend: t_first_byte → t_play_start (decode + schedule delay).
let t_send       = null;   // performance.now() when audio was sent
let t_transcript = null;   // performance.now() when transcript arrived
let t_first_byte = null;   // performance.now() when first PCM chunk arrived
let t_play_start = null;   // performance.now() when first buffer starts
let _fe_timing_logged = false;  // only log once per interaction

function getAudioContext() {
    if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: audioFormat.sampleRate,
        });
        nextPlayTime = audioCtx.currentTime;
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

/**
 * Called for every binary WebSocket message.
 * Routes the chunk to the currently-open sentence buffer.
 * Backward-compatible: RIFF-header WAV is decoded and scheduled directly.
 */
function handleBinaryChunk(arrayBuffer) {
    // First binary chunk of this interaction — record arrival time for FE timing
    if (t_first_byte === null) {
        t_first_byte = performance.now();
    }

    // Backward-compat: WAV starts with 0x52494646 "RIFF"
    const view = new DataView(arrayBuffer);
    if (view.byteLength >= 4 && view.getUint32(0, false) === 0x52494646) {
        getAudioContext().decodeAudioData(
            arrayBuffer.slice(0),
            (decoded) => scheduleAudioBuffer(decoded),
            (e) => console.error('[audio] WAV decode error:', e)
        );
        return;
    }

    // PCM int16 path — find the sentence buffer that is open (not yet done)
    // The last opened (audio_chunk_start received, audio_chunk_end not yet) is the active one
    const activeSid = findActiveSentenceId();
    if (activeSid !== null) {
        pendingSentences[activeSid].chunks.push(arrayBuffer);
    } else {
        console.warn('[audio] Binary chunk with no open sentence buffer — ignored');
    }
}

/** Returns the highest sentence_id that has been started but not yet ended, or null. */
function findActiveSentenceId() {
    let active = null;
    for (const sid of Object.keys(pendingSentences)) {
        const entry = pendingSentences[sid];
        if (!entry.done) {
            const n = Number(sid);
            if (active === null || n > active) active = n;
        }
    }
    return active;
}

/**
 * Called on audio_chunk_end: mark sentence as complete and try playing.
 */
function onSentenceEnd(sid) {
    if (!pendingSentences[sid]) {
        console.warn(`[audio] audio_chunk_end for unknown sentence #${sid}`);
        return;
    }
    pendingSentences[sid].done = true;
    tryPlayNextSentence();
}

/**
 * Plays sentences in strict order: nextSentenceId, nextSentenceId+1, ...
 * Only advances when the current sentence is both complete and played.
 */
function tryPlayNextSentence() {
    const entry = pendingSentences[nextSentenceId];
    if (!entry || !entry.done) {
        // Not ready yet — will be called again when audio_chunk_end arrives
        return;
    }

    const chunks = entry.chunks;
    delete pendingSentences[nextSentenceId];
    nextSentenceId++;

    if (chunks.length === 0) {
        // Empty sentence (cancelled before any chunks arrived) — skip
        tryPlayNextSentence();
        return;
    }

    // Concatenate all ArrayBuffers for this sentence
    const totalBytes = chunks.reduce((acc, b) => acc + b.byteLength, 0);
    const combined   = new Uint8Array(totalBytes);
    let offset = 0;
    for (const chunk of chunks) {
        combined.set(new Uint8Array(chunk), offset);
        offset += chunk.byteLength;
    }

    // int16 -> float32
    const int16View   = new Int16Array(combined.buffer);
    const numSamples  = int16View.length;
    const ctx         = getAudioContext();
    const audioBuffer = ctx.createBuffer(audioFormat.channels, numSamples, audioFormat.sampleRate);
    const float32     = audioBuffer.getChannelData(0);
    for (let i = 0; i < numSamples; i++) {
        float32[i] = int16View[i] / 32767;
    }

    // Schedule with onended callback to chain the next sentence
    scheduleAudioBuffer(audioBuffer, () => {
        tryPlayNextSentence();
    });
}

/**
 * Schedule an AudioBuffer for gapless sequential playback.
 * Optional onEnded callback fires when this buffer finishes playing.
 */
function scheduleAudioBuffer(audioBuffer, onEnded = null) {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    if (nextPlayTime < now + 0.05) {
        nextPlayTime = now + 0.05;
    }

    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ctx.destination);
    source.start(nextPlayTime);

    // Log FE timing breakdown once per interaction (at first buffer play)
    if (!_fe_timing_logged && t_send !== null) {
        _fe_timing_logged = true;
        t_play_start = performance.now();
        const total      = t_play_start - t_send;
        const toTranscript = t_transcript !== null ? (t_transcript - t_send).toFixed(0) : '?';
        const toByte       = t_first_byte  !== null ? (t_first_byte  - t_send).toFixed(0) : '?';
        const toPlay       = (t_play_start - t_send).toFixed(0);
        const byteToPlay   = t_first_byte  !== null ? (t_play_start - t_first_byte).toFixed(0) : '?';
        console.log(
            `[FE timing] send→transcript: ${toTranscript}ms` +
            ` | send→first_byte: ${toByte}ms` +
            ` | first_byte→play: ${byteToPlay}ms` +
            ` | total send→play: ${toPlay}ms`
        );
    }

    nextPlayTime += audioBuffer.duration;

    btn.classList.add('playing');
    setStatus('Reproduciendo...');
    isPlaying = true;

    source.onended = () => {
        if (onEnded) onEnded();
        // If nothing more is scheduled, mark idle
        const currentNow = ctx.currentTime;
        if (nextPlayTime <= currentNow + 0.15) {
            isPlaying = false;
            btn.classList.remove('playing');
            setStatus('Listo para escuchar');
            nextPlayTime = 0;
        }
    };
}

// ─── B3: Historial de conversación ────────────────────────────────────────────
let conversationHistory = [];  // [{role: "user"|"assistant", content: "..."}]
const MAX_TURNS = 6;           // Máximo de turnos a mantener (= 12 mensajes)
let pendingUserText = null;    // Texto transcrito, esperando respuesta del LLM

// ─── Helpers de estado ────────────────────────────────────────────────────────
function setStatus(text, cls = 'active') {
    statusText.textContent = text;
    statusEl.className = cls;
}

// ─── B4: Historial UI ─────────────────────────────────────────────────────────
function addHistoryEntry(text, role = 'system') {
    // Eliminar hint vacío si existe
    const hint = historyMsgs.querySelector('.empty-hint');
    if (hint) hint.remove();

    const div = document.createElement('div');
    div.className = `msg msg-${role}`;
    div.textContent = text;
    historyMsgs.appendChild(div);
    historyMsgs.scrollTop = historyMsgs.scrollHeight;
}

function clearHistory() {
    conversationHistory = [];
    pendingUserText = null;
    historyMsgs.innerHTML = '<p class="empty-hint">Historial borrado. Habla con Kelly para comenzar.</p>';
    console.log('[history] Historial borrado');
}

clearBtn.addEventListener('click', clearHistory);

function trimHistory() {
    // Mantener máximo MAX_TURNS turnos (2 mensajes por turno)
    const maxMsgs = MAX_TURNS * 2;
    if (conversationHistory.length > maxMsgs) {
        conversationHistory.splice(0, conversationHistory.length - maxMsgs);
    }
}

// ─── Barge-in: detener audio y notificar backend ──────────────────────────────
function cancelPlayback() {
    // Kill AudioContext — stops all scheduled sources immediately
    if (audioCtx && audioCtx.state !== 'closed') {
        audioCtx.close().catch(() => {});
        audioCtx = null;
        nextPlayTime = 0;
    }

    // Reset ordered-playback state
    pendingSentences = {};
    nextSentenceId   = 0;
    isPlaying        = false;
    btn.classList.remove('playing');

    // Reset FE timing so a barge-in doesn't bleed stale timestamps into the next interaction
    t_send = null; t_transcript = null; t_first_byte = null;
    t_play_start = null; _fe_timing_logged = false;

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'cancel' }));
    }
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 16000;

function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}/ws/audio`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        connDot.className = 'connected';
        setStatus('Listo para escuchar');
        reconnectDelay = 1000;
        console.log('[ws] Conectado');
    };

    ws.onclose = () => {
        connDot.className = 'disconnected';
        setStatus('Desconectado — reconectando...', 'error');
        console.warn(`[ws] Desconectado. Reintentando en ${reconnectDelay}ms`);
        setTimeout(connectWebSocket, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
    };

    ws.onerror = (e) => {
        console.error('[ws] Error:', e);
    };

    ws.onmessage = (event) => {
        // ── Binary: raw PCM int16 chunk ────────────────────────────────────
        if (event.data instanceof ArrayBuffer) {
            handleBinaryChunk(event.data);
            return;
        }

        // ── Text: control JSON ─────────────────────────────────────────────
        try {
            const msg = JSON.parse(event.data);

            if (msg.type === 'audio_format') {
                audioFormat.sampleRate = msg.sample_rate || 24000;
                audioFormat.channels   = msg.channels    || 1;
                audioFormat.dtype      = msg.dtype        || 'int16';
                console.log('[ws] Audio format:', audioFormat);

            } else if (msg.type === 'audio_chunk_start') {
                // Open a new ordered buffer for this sentence
                const sid = msg.sentence_id;
                pendingSentences[sid] = { chunks: [], done: false };
                console.log(`[tts] Sentence #${sid} start`);

            } else if (msg.type === 'audio_chunk_end') {
                const sid = msg.sentence_id;
                console.log(`[tts] Sentence #${sid} end (${msg.chunk_count} chunks)`);
                onSentenceEnd(sid);

            } else if (msg.type === 'transcript') {
                t_transcript = performance.now();   // [FE timing] STT done, transcript received
                pendingUserText = msg.text;
                addHistoryEntry(msg.text, 'user');
                conversationHistory.push({ role: 'user', content: msg.text });
                trimHistory();
                console.log('[history] User:', msg.text);

            } else if (msg.type === 'assistant_text') {
                if (msg.text) {
                    conversationHistory.push({ role: 'assistant', content: msg.text });
                    trimHistory();
                    addHistoryEntry(msg.text, 'assistant');
                    console.log('[history] Kelly:', msg.text);
                }

            } else if (msg.type === 'no_speech') {
                setStatus('No se detectó habla. Inténtalo de nuevo.');
                addHistoryEntry('(sin voz detectada)', 'system');

            } else if (msg.type === 'error') {
                setStatus(`Error: ${msg.message}`, 'error');
                addHistoryEntry(`Error: ${msg.message}`, 'system');
            }
        } catch {
            // Not JSON, ignore
        }
    };
}

// ─── Grabación (MediaRecorder) ────────────────────────────────────────────────
navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => {
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
                ? 'audio/ogg;codecs=opus'
                : '';

        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                setStatus('Sin conexión al servidor', 'error');
                return;
            }
            const mtype = mediaRecorder.mimeType || 'audio/webm';
            const blob = new Blob(audioChunks, { type: mtype });
            audioChunks = [];
            setStatus('Procesando...');

            // Reset FE timing state for this interaction
            t_send = null; t_transcript = null; t_first_byte = null;
            t_play_start = null; _fe_timing_logged = false;

            // B3: Enviar historial ANTES del audio binario
            const historyToSend = conversationHistory.slice();
            if (historyToSend.length > 0) {
                ws.send(JSON.stringify({
                    type: 'audio_with_history',
                    history: historyToSend,
                }));
            }

            // Enviar el audio binario y capturar t_send cuando sale por el WS
            blob.arrayBuffer().then(buf => {
                ws.send(buf);
                t_send = performance.now();  // [FE timing] audio sent, pipeline starts
            });
        };

        // ── Push-to-Talk handlers ──────────────────────────────────────────
        const startRecording = (e) => {
            e.preventDefault();
            cancelPlayback();   // barge-in

            audioChunks = [];
            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            mediaRecorder.start();

            btn.classList.add('recording');
            btnLabel.textContent = 'Escuchando';
            setStatus('Escuchando...');
        };

        const stopRecording = (e) => {
            e.preventDefault();
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                btnLabel.textContent = 'Hablar';
            }
        };

        btn.addEventListener('mousedown', startRecording);
        btn.addEventListener('mouseup', stopRecording);
        btn.addEventListener('touchstart', startRecording, { passive: false });
        btn.addEventListener('touchend', stopRecording, { passive: false });
        btn.addEventListener('mouseleave', stopRecording);
    })
    .catch(err => {
        setStatus('Permiso de micrófono denegado', 'error');
        btn.disabled = true;
        console.error('[mic] Error:', err);
    });

// ─── Iniciar WebSocket ────────────────────────────────────────────────────────
connectWebSocket();
</script>
</body>
</html>
